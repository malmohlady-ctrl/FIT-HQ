<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141519">
<title>FIT HQ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#141519; --bg2:#1a1b20; --card:#1f2127; --card2:#26282f; --line:#2e3038;
  --ink:#f2f1ec; --mut:#9a9ba4; --dim:#6d6e77;
  --org:#ff7a1a; --org2:#ffa25e; --grn:#43c47c; --grn2:#7ed6a5;
  --blu:#5aa2e0; --red:#e05a5a; --gold:#e8a33d;
  --r:16px; --nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom));min-height:100vh}
a{color:var(--org2)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--org);outline-offset:0;border-color:transparent}
label{display:block;font-size:.78rem;color:var(--mut);margin:10px 0 4px;font-weight:600;letter-spacing:.02em}
h1{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.05rem;font-weight:700;margin:18px 0 8px}
h3{font-size:.95rem;font-weight:700}
.small{font-size:.8rem}.muted{color:var(--mut)}.dim{color:var(--dim)}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px 8px}
header.top{padding:16px 14px 4px;max-width:680px;margin:0 auto}
header.top .date{color:var(--mut);font-size:.82rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.tight{padding:10px 14px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--org);color:#16100a;
  font-weight:700;border-radius:12px;padding:12px 16px;font-size:.95rem;min-height:48px}
.btn:active{transform:scale(.98)}
.btn.grn{background:var(--grn);color:#0a1610}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--line);
  border-radius:999px;padding:7px 12px;font-size:.82rem;font-weight:600;min-height:36px}
.chip.on{background:var(--org);color:#16100a;border-color:var(--org)}
.chip.grn.on{background:var(--grn);color:#0a1610;border-color:var(--grn)}
.bar{height:9px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--org);border-radius:99px;transition:width .35s}
.bar.g>i{background:var(--grn)}.bar.b>i{background:var(--blu)}.bar.gold>i{background:var(--gold)}
.kcal-num{font-size:2rem;font-weight:800;line-height:1}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .t{font-weight:600;font-size:.93rem}
.item .s{font-size:.78rem;color:var(--mut)}
.item .kc{font-weight:700;font-size:.92rem;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--line);
  display:inline-flex;align-items:center;justify-content:center;font-size:1rem;flex:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(20,21,25,.96);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);display:flex;z-index:40}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--dim);font-size:.66rem;font-weight:700;letter-spacing:.03em}
nav.bottom button .ic{font-size:1.25rem;line-height:1}
nav.bottom button.on{color:var(--org)}
.view{display:none}.view.on{display:block}
.modal{position:fixed;inset:0;background:rgba(8,8,10,.7);z-index:60;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
  width:100%;max-width:680px;max-height:92vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin-bottom:4px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:.82rem;font-weight:700;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--ink)}
canvas.chart{width:100%;display:block}
.stat{text-align:center}
.stat .v{font-size:1.25rem;font-weight:800}
.stat .k{font-size:.7rem;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.empty{padding:22px 10px;text-align:center;color:var(--mut);font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 18px);background:var(--card2);
  border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:600;
  z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
.toast.on{opacity:1}
.err{background:#3a1d1d;border:1px solid #6e3535;color:#f0b9b9;border-radius:10px;padding:10px 12px;font-size:.85rem;margin:8px 0}
.okn{background:#173327;border:1px solid #2c5c42;color:#a9e6c6;border-radius:10px;padding:10px 12px;font-size:.85rem;margin:8px 0}
.macroline{display:flex;justify-content:space-between;font-size:.82rem;margin-top:8px}
.macroline b{font-size:.9rem}
.ringwrap{position:relative;width:132px;height:132px;flex:none}
.ringwrap .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.datebar{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.datebar .d{font-weight:800;font-size:1.02rem}
fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px 12px;margin:10px 0}
legend{font-size:.78rem;font-weight:700;color:var(--mut);padding:0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
video#scanvid{width:100%;border-radius:12px;background:#000}
@media(min-width:720px){.sheet{border-radius:20px;margin-bottom:24px}.modal{align-items:center}}
</style>
</head>
<body>
<header class="top"><div class="date" id="topDate"></div><h1 id="topTitle">FIT HQ</h1></header>
<main class="wrap">
  <section class="view" id="view-home"></section>
  <section class="view" id="view-nutrition"></section>
  <section class="view" id="view-workouts"></section>
  <section class="view" id="view-progress"></section>
  <section class="view" id="view-settings"></section>
</main>
<nav class="bottom" id="bottomnav">
  <button data-nav="home"><span class="ic">⌂</span>Home</button>
  <button data-nav="nutrition"><span class="ic">🥗</span>Nutrition</button>
  <button data-nav="workouts"><span class="ic">🏋️</span>Workouts</button>
  <button data-nav="progress"><span class="ic">📈</span>Progress</button>
  <button data-nav="settings"><span class="ic">⚙️</span>Settings</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="nutrition.js"></script>
<script src="workouts.js"></script>
<script src="progress.js"></script>
<script src="extras.js"></script>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>
